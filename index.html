<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UAT Solutions Inc. — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0d2137;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 3rem;
      justify-content: center;
    }
    .logo-icon {
      background: #fff;
      width: 48px; height: 48px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700;
    }
    .logo-icon .u { color: #0d2137; }
    .logo-icon .arr { color: #e86c2c; }
    .logo-text { text-align: left; line-height: 1.1; }
    .logo-text strong { display: block; font-size: 1.05rem; letter-spacing: 0.04em; }
    .logo-text span { font-size: 0.58rem; letter-spacing: 0.12em; opacity: 0.5; }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 500;
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }
    h1 em { font-style: italic; color: #e86c2c; }
    p {
      font-size: 1rem;
      color: rgba(255,255,255,.55);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    a {
      display: inline-block;
      background: #e86c2c;
      color: #fff;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    a:hover { background: #f08040; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon"><span class="u">U</span><span class="arr">↑</span></div>
    <div class="logo-text">
      <strong>UAT</strong>
      <span>SOLUTIONS INC.</span>
    </div>
  </div>
  <h1>We'll be back <em>soon.</em></h1>
  <p>Our website is temporarily offline for scheduled maintenance. We'll be back up shortly — thank you for your patience.</p>
  <a href="mailto:dispatch@uatsolutions.com">Contact Us →</a>
</body>
</html>
